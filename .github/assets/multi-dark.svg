<svg xmlns="http://www.w3.org/2000/svg" width="720" height="468" viewBox="0 0 720 468" role="img" aria-label="A Multi is a list of named steps; repo.transact runs them in one transaction, passing each step the results so far, and either commits them all or rolls back at the first failure">
<title>A Multi is a list of named steps; repo.transact runs them in one transaction, passing each step the results so far, and either commits them all or rolls back at the first failure</title>
<style>
  .t { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #E6EDF3; }
  .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #E6EDF3; }
  .muted { fill: #9198A1; }
  .acc { fill: #3FC1A5; }
  .bad { fill: #F07A62; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#9198A1"/>
  </marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3FC1A5"/>
  </marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#F07A62"/>
  </marker>
</defs>
<rect x="16" y="16" width="688" height="196" rx="14" fill="none" stroke="#3D444D" stroke-width="1.5" stroke-dasharray="5 5"/><text x="36" y="42" class="m" font-size="13" font-weight="600" text-anchor="start" >Multi.new()</text><text x="132" y="42" class="t muted" font-size="12" font-weight="400" text-anchor="start" >named steps, as data: nothing runs yet. Each step gets the results so far.</text><rect x="32" y="58" width="196" height="112" rx="10" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><rect x="46" y="70" width="50.4" height="22" rx="11" fill="#10302A" stroke="#3FC1A5" stroke-width="1.2"/><text x="56" y="85" class="m acc" font-size="12" font-weight="600" text-anchor="start" >user</text><text x="48" y="116" class="m" font-size="12" font-weight="400" text-anchor="start" >insert(changeset(</text><text x="62" y="135" class="m" font-size="12" font-weight="400" text-anchor="start" >User.new(), params))</text><path d="M228 114 H258" fill="none" stroke="#9198A1" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M245 118 V182" stroke="#3D444D" stroke-width="1.2" stroke-dasharray="2 3"/><text x="245" y="198" class="m muted" font-size="12" font-weight="400" text-anchor="middle" >{ user }</text><rect x="262" y="58" width="196" height="112" rx="10" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><rect x="276" y="70" width="50.4" height="22" rx="11" fill="#10302A" stroke="#3FC1A5" stroke-width="1.2"/><text x="286" y="85" class="m acc" font-size="12" font-weight="600" text-anchor="start" >post</text><text x="278" y="116" class="m" font-size="12" font-weight="400" text-anchor="start" >insert(({ user }) =&gt;</text><text x="292" y="135" class="m" font-size="12" font-weight="400" text-anchor="start" >buildAssoc(user,</text><text x="306" y="154" class="m" font-size="12" font-weight="400" text-anchor="start" >"posts"))</text><path d="M458 114 H488" fill="none" stroke="#9198A1" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M475 118 V182" stroke="#3D444D" stroke-width="1.2" stroke-dasharray="2 3"/><text x="475" y="198" class="m muted" font-size="12" font-weight="400" text-anchor="middle" >{ user, post }</text><rect x="492" y="58" width="196" height="112" rx="10" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><rect x="506" y="70" width="73.19999999999999" height="22" rx="11" fill="#10302A" stroke="#3FC1A5" stroke-width="1.2"/><text x="516" y="85" class="m acc" font-size="12" font-weight="600" text-anchor="start" >welcome</text><text x="508" y="116" class="m" font-size="12" font-weight="400" text-anchor="start" >run(async (tx,</text><text x="522" y="135" class="m" font-size="12" font-weight="400" text-anchor="start" >{ user }) =&gt;</text><text x="522" y="154" class="m" font-size="12" font-weight="400" text-anchor="start" >sendWelcome(user))</text><path d="M360 212 V240" fill="none" stroke="#9198A1" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="256" y="244" width="208" height="44" rx="10" fill="#10302A" stroke="#3FC1A5" stroke-width="2"/><text x="360" y="271" class="m acc" font-size="14" font-weight="600" text-anchor="middle" >repo.transact(multi)</text><text x="236" y="264" class="t muted" font-size="12" font-weight="400" text-anchor="end" >one transaction:</text><text x="236" y="281" class="t muted" font-size="12" font-weight="400" text-anchor="end" >the steps run in order</text><path d="M320 288 V310 H184 V332" fill="none" stroke="#3FC1A5" stroke-width="1.6"  marker-end="url(#arrA)"/><path d="M400 288 V310 H536 V332" fill="none" stroke="#F07A62" stroke-width="1.6"  marker-end="url(#arrB)"/><text x="174" y="328" class="m acc" font-size="11" font-weight="600" text-anchor="end" >COMMIT</text><text x="546" y="328" class="m bad" font-size="11" font-weight="600" text-anchor="start" >ROLLBACK</text><rect x="16" y="336" width="336" height="116" rx="10" fill="#10302A" stroke="#3FC1A5" stroke-width="1.5"/><text x="32" y="364" class="m acc" font-size="13" font-weight="600" text-anchor="start" >{ ok: true, value }</text><text x="32" y="390" class="t muted" font-size="12" font-weight="400" text-anchor="start" >every step succeeded, and all of it is saved</text><text x="32" y="432" class="m" font-size="12" font-weight="400" text-anchor="start" >value: { user, post, welcome }</text><rect x="368" y="336" width="336" height="116" rx="10" fill="#3A1A14" stroke="#F07A62" stroke-width="1.5"/><text x="384" y="364" class="m bad" font-size="12" font-weight="600" text-anchor="start" >{ ok: false, step, error, changesSoFar }</text><text x="384" y="390" class="t muted" font-size="12" font-weight="400" text-anchor="start" >the first failure stops the rest and undoes</text><text x="384" y="408" class="t muted" font-size="12" font-weight="400" text-anchor="start" >what ran before it, e.g. if the post is invalid:</text><text x="384" y="432" class="m" font-size="12" font-weight="400" text-anchor="start" >step: "post", changesSoFar: { user }</text>
</svg>
