roke="#C4432B" stroke-width="1.6"  marker-end="url(#arrB)"/><rect x="282" y="124" width="80" height="64" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><path d="M282 144 H362" stroke="#D1D9E0" stroke-width="1.5"/><text x="322" y="138" class="m muted" font-size="11" font-weight="400" text-anchor="middle" >users</text><text x="322" y="171" class="t muted" font-size="12" font-weight="400" text-anchor="middle" font-style="italic">empty</text><text x="322" y="208" class="t muted" font-size="11" font-weight="400" text-anchor="middle" >after: empty again</text><rect x="415" y="36" width="289" height="182" rx="10" fill="none" stroke="#D1D9E0" stroke-width="1.5"/><text x="431" y="60" class="t" font-size="14" font-weight="600" text-anchor="start" >test 2</text><rect x="427" y="76" width="54" height="26" rx="13" fill="#E3F4F0" stroke="#1A7F6E"/><text x="454" y="93" class="m acc" font-size="11" font-weight="400" text-anchor="middle" >BEGIN</text><path d="M481 89 H496" fill="none" stroke="#59636E" stroke-width="1.6"  marker-end="url(#arr)"/><text x="503" y="94" class="m" font-size="12" font-weight="400" text-anchor="start" >createUser(bob)</text><path d="M613 89 H625" fill="none" stroke="#59636E" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="629" y="76" width="62" height="26" rx="13" fill="#FBEAE6" stroke="#C4432B"/><text x="660" y="93" class="m bad" font-size="10.5" font-weight="400" text-anchor="middle" >ROLLBACK</text><rect x="455" y="124" width="80" height="64" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><path d="M455 144 H535" stroke="#D1D9E0" stroke-width="1.5"/><text x="495" y="138" class="m muted" font-size="11" font-weight="400" text-anchor="middle" >users</text><text x="467" y="164" class="m" font-size="12" font-weight="400" text-anchor="start" >1 bob</text><text x="495" y="208" class="t muted" font-size="11" font-weight="400" text-anchor="middle" >during: 1 row</text><path d="M543 156 H579" fill="none" stroke="#C4432B" stroke-width="1.6"  marker-end="url(#arrB)"/><rect x="585" y="124" width="80" height="64" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><path d="M585 144 H665" stroke="#D1D9E0" stroke-width="1.5"/><text x="625" y="138" class="m muted" font-size="11" font-weight="400" text-anchor="middle" >users</text><text x="625" y="171" class="t muted" font-size="12" font-weight="400" text-anchor="middle" font-style="italic">empty</text><text x="625" y="208" class="t muted" font-size="11" font-weight="400" text-anchor="middle" >after: empty again</text><text x="360" y="256" class="t muted" font-size="13" font-weight="400" text-anchor="middle" >sandbox(repo): each test runs in a transaction that is rolled back,</text><text x="360" y="276" class="t muted" font-size="13" font-weight="400" text-anchor="middle" >so tests never see each other's rows</text>
