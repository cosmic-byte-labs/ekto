<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Each test runs in a transaction that is rolled back, so the users table is empty again after every test">
<title>Each test runs in a transaction that is rolled back, so the users table is empty again after every test</title>
<style>
