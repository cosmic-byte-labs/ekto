<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" role="img" aria-label="The quickstart's changeset: params are cast and validated, the Repo inserts, and the result is either the record or the changeset with its errors">
<title>The quickstart's changeset: params are cast and validated, the Repo inserts, and the result is either the record or the changeset with its errors</title>
<style>
  .t { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1F2328; }
  .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #1F2328; }
  .muted { fill: #59636E; }
  .acc { fill: #1A7F6E; }
  .bad { fill: #C4432B; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#59636E"/>
  </marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#1A7F6E"/>
  </marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#C4432B"/>
  </marker>
</defs>
<rect x="16" y="16" width="196" height="168" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text x="32" y="44" class="t muted" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6">PARAMS</text><text x="32" y="80" class="t muted" font-size="12" font-weight="400" text-anchor="start" >email</text><text x="76" y="80" class="m" font-size="12" font-weight="400" text-anchor="start" >"ann@example.com"</text><text x="32" y="108" class="t muted" font-size="12" font-weight="400" text-anchor="start" >name</text><text x="76" y="108" class="m" font-size="12" font-weight="400" text-anchor="start" >"Ann"</text><path d="M212 100 H224" fill="none" stroke="#59636E" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="228" y="16" width="256" height="168" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text x="244" y="44" class="m muted" font-size="12" font-weight="400" text-anchor="start" >changeset(User.new(), params)</text><circle cx="248" cy="76" r="4" fill="#1A7F6E"/><path d="M248 81 V100" stroke="#D1D9E0" stroke-width="1.5"/><text x="260" y="80" class="m" font-size="12" font-weight="600" text-anchor="start" >cast</text><text x="295.92" y="80" class="m muted" font-size="12" font-weight="400" text-anchor="start" >["email", "name"]</text><circle cx="248" cy="104" r="4" fill="#1A7F6E"/><path d="M248 109 V128" stroke="#D1D9E0" stroke-width="1.5"/><text x="260" y="108" class="m" font-size="12" font-weight="600" text-anchor="start" >validateRequired</text><text x="382.68" y="108" class="m muted" font-size="12" font-weight="400" text-anchor="start" >["email"]</text><circle cx="248" cy="132" r="4" fill="#1A7F6E"/><path d="M248 137 V156" stroke="#D1D9E0" stroke-width="1.5"/><text x="260" y="136" class="m" font-size="12" font-weight="600" text-anchor="start" >validateFormat</text><text x="368.22" y="136" class="m muted" font-size="12" font-weight="400" text-anchor="start" >"email", /@/</text><circle cx="248" cy="160" r="3.6" fill="#F6F8FA" stroke="#1A7F6E" stroke-width="1.8"/><text x="260" y="164" class="m" font-size="12" font-weight="600" text-anchor="start" >uniqueConstraint</text><text x="382.68" y="164" class="m muted" font-size="12" font-weight="400" text-anchor="start" >"email"</text><path d="M484 100 H496" fill="none" stroke="#59636E" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="500" y="16" width="204" height="168" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text x="516" y="44" class="t muted" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6">THE CHANGESET</text><text x="516" y="80" class="t muted" font-size="12" font-weight="400" text-anchor="start" >valid</text><text x="586" y="80" class="m" font-size="12" font-weight="400" text-anchor="start" >true</text><text x="516" y="108" class="t muted" font-size="12" font-weight="400" text-anchor="start" >changes</text><text x="586" y="108" class="m" font-size="12" font-weight="400" text-anchor="start" >{ email, name }</text><text x="516" y="136" class="t muted" font-size="12" font-weight="400" text-anchor="start" >errors</text><text x="586" y="136" class="m" font-size="12" font-weight="400" text-anchor="start" >[]</text><text x="516" y="164" class="t muted" font-size="12" font-weight="400" text-anchor="start" >constraints</text><text x="586" y="164" class="m" font-size="12" font-weight="400" text-anchor="start" >unique email</text><circle cx="684.76" cy="160" r="3.6" fill="#F6F8FA" stroke="#1A7F6E" stroke-width="1.8"/><path d="M602 184 V234 H476" fill="none" stroke="#59636E" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="248" y="212" width="224" height="44" rx="10" fill="#E3F4F0" stroke="#1A7F6E" stroke-width="2"/><text x="360" y="239" class="m acc" font-size="14" font-weight="600" text-anchor="middle" >repo.insert(changeset)</text><circle cx="64" cy="226" r="3.6" fill="#F6F8FA" stroke="#1A7F6E" stroke-width="1.8"/><text x="76" y="230" class="t muted" font-size="12" font-weight="400" text-anchor="start" >constraints are checked</text><text x="76" y="247" class="t muted" font-size="12" font-weight="400" text-anchor="start" >by the database</text><path d="M320 256 V278 H184 V300" fill="none" stroke="#1A7F6E" stroke-width="1.6"  marker-end="url(#arrA)"/><path d="M400 256 V278 H536 V300" fill="none" stroke="#C4432B" stroke-width="1.6"  marker-end="url(#arrB)"/><rect x="16" y="304" width="336" height="116" rx="10" fill="#E3F4F0" stroke="#1A7F6E" stroke-width="1.5"/><text x="32" y="332" class="m acc" font-size="13" font-weight="600" text-anchor="start" >{ ok: true, value: User }</text><text x="32" y="358" class="t muted" font-size="12" font-weight="400" text-anchor="start" >inserted, with the generated id and timestamps</text><text x="32" y="400" class="m" font-size="12" font-weight="400" text-anchor="start" >{ id: 1, email: "ann@example.com", … }</text><rect x="368" y="304" width="336" height="116" rx="10" fill="#FBEAE6" stroke="#C4432B" stroke-width="1.5"/><text x="384" y="332" class="m bad" font-size="13" font-weight="600" text-anchor="start" >{ ok: false, changeset }</text><text x="384" y="358" class="t muted" font-size="12" font-weight="400" text-anchor="start" >invalid: returned before any SQL is sent</text><text x="384" y="378" class="t muted" font-size="12" font-weight="400" text-anchor="start" >a taken email: the unique violation becomes</text><text x="384" y="400" class="m" font-size="12" font-weight="400" text-anchor="start" >{ email: ["has already been taken"] }</text>
</svg>
