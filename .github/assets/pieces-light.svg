<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-label="A changeset is written and a query is read through the Repo, the only part that touches the database; both come back as plain values typed by the schema">
<title>A changeset is written and a query is read through the Repo, the only part that touches the database; both come back as plain values typed by the schema</title>
<style>
  .t { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1F2328; }
  .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #1F2328; }
  .muted { fill: #59636E; }
  .acc { fill: #1A7F6E; }
  .bad { fill: #C4432B; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#59636E"/>
  </marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#1A7F6E"/>
  </marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#C4432B"/>
  </marker>
</defs>
<rect x="16" y="16" width="688" height="52" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text x="36" y="48" class="t" font-size="15" font-weight="600" text-anchor="start" >Schema</text><text x="104" y="48" class="m" font-size="13" font-weight="400" text-anchor="start" >User = schema("users", { id, email, name, … })</text><text x="684" y="48" class="t muted" font-size="12" font-weight="400" text-anchor="end" >types every step below</text><text x="18" y="104" class="t muted" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6">YOU BUILD (NO I/O)</text><text x="280" y="104" class="t muted" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6">THE REPO RUNS IT</text><text x="464" y="104" class="t muted" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6">YOU GET BACK</text><rect x="16" y="124" width="242" height="88" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text x="32" y="150" class="t" font-size="15" font-weight="600" text-anchor="start" >Changeset</text><text x="242" y="150" class="t muted" font-size="11" font-weight="400" text-anchor="end" letter-spacing="0.6">write</text><text x="32" y="176" class="m" font-size="12" font-weight="400" text-anchor="start" >changeset(User.new(), params)</text><text x="32" y="196" class="t muted" font-size="12" font-weight="400" text-anchor="start" >validated: changes and errors</text><path d="M258 168 H274" fill="none" stroke="#59636E" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="16" y="228" width="242" height="88" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text x="32" y="254" class="t" font-size="15" font-weight="600" text-anchor="start" >Query</text><text x="242" y="254" class="t muted" font-size="11" font-weight="400" text-anchor="end" letter-spacing="0.6">read</text><text x="32" y="280" class="m" font-size="12" font-weight="400" text-anchor="start" >selectFrom("users")</text><text x="32" y="300" class="t muted" font-size="12" font-weight="400" text-anchor="start" >a Kysely builder, from repo.kysely</text><path d="M258 272 H274" fill="none" stroke="#59636E" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="278" y="124" width="164" height="192" rx="10" fill="#E3F4F0" stroke="#1A7F6E" stroke-width="2"/><text x="360" y="226" class="t acc" font-size="18" font-weight="700" text-anchor="middle" >Repo</text><rect x="290" y="154" width="140" height="28" rx="14" fill="#F6F8FA" stroke="#1A7F6E" stroke-width="1.2"/><text x="360" y="173" class="m acc" font-size="12" font-weight="600" text-anchor="middle" >.insert(changeset)</text><path d="M442 168 H458" fill="none" stroke="#1A7F6E" stroke-width="1.6"  marker-end="url(#arrA)"/><rect x="290" y="258" width="140" height="28" rx="14" fill="#F6F8FA" stroke="#1A7F6E" stroke-width="1.2"/><text x="360" y="277" class="m acc" font-size="12" font-weight="600" text-anchor="middle" >.all(User, query)</text><path d="M442 272 H458" fill="none" stroke="#1A7F6E" stroke-width="1.6"  marker-end="url(#arrA)"/><rect x="462" y="124" width="242" height="88" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text x="478" y="152" class="m" font-size="12" font-weight="400" text-anchor="start" >{ ok: true, value: User }</text><text x="478" y="172" class="m" font-size="12" font-weight="400" text-anchor="start" >{ ok: false, changeset }</text><text x="478" y="196" class="t muted" font-size="12" font-weight="400" text-anchor="start" >the record, or the errors</text><rect x="462" y="228" width="242" height="88" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text x="478" y="256" class="m" font-size="12" font-weight="400" text-anchor="start" >User[]</text><text x="478" y="300" class="t muted" font-size="12" font-weight="400" text-anchor="start" >plain objects, one per row</text><path d="M346 316 V346" fill="none" stroke="#1A7F6E" stroke-width="1.6"  marker-end="url(#arrA)"/><path d="M374 346 V320" fill="none" stroke="#1A7F6E" stroke-width="1.6"  marker-end="url(#arrA)"/><path d="M280 359 A80 9 0 0 1 440 359 V411 A80 9 0 0 1 280 411 Z" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/>
<path d="M280 359 A80 9 0 0 0 440 359" fill="none" stroke="#D1D9E0" stroke-width="1.5"/><text x="360" y="388" class="t" font-size="14" font-weight="600" text-anchor="middle" >Database</text><text x="360" y="406" class="t muted" font-size="11" font-weight="400" text-anchor="middle" >Postgres · SQLite</text><text x="454" y="380" class="t muted" font-size="12" font-weight="400" text-anchor="start" >the only part that</text><text x="454" y="397" class="t muted" font-size="12" font-weight="400" text-anchor="start" >touches the database</text>
</svg>
